# twitch_chat.lua options  (change values, then restart mpv)
# Text size / width can also be changed live via the uosc menu or keys.

# Auto-show chat as soon as a Twitch stream loads (yes/no).
# If no, use Alt+C (or the uosc menu) to toggle it per stream.
enabled=yes

# Force a specific channel login (blank = auto-detect from the stream URL).
# Auto-detection handles both twitch.tv/<name> and kick.com/<name> URLs.
channel=

# When channel= is set above, which platform it's on: twitch or kick
# (blank = twitch). Leave blank to rely on auto-detection.
platform=

# Which side the overlay sits on: right or left
position=right

# Gap from the screen edge, in screen pixels
margin=24

# Render 3rd-party emotes from 7TV / BetterTTV / FrankerFaceZ (yes/no).
# Twitch's own native emotes always render regardless of this.
# Animated emotes (gif/webp) are animated live.
emotes=yes

# ---- size / layout ----

# Chat column width in pixels. Live keys: width-up / width-down.
width=420

# Text size in pixels. Live keys: size-up / size-down.
font_px=20

# Emote size as a multiple of the text size (bigger emotes vs text, anu-style).
# Live keys: emote-up / emote-down.
emote_scale=1.8

# Column height as a fraction of the player height. 1.0 = full height
# (top to bottom); 0.5 = bottom half; etc. Messages fill from the bottom up.
height_frac=1.0

# Line height = font_px * this
line_ratio=1.5

# Black outline thickness in px. 0 = auto (scales with font size).
outline=0

# Message buffer size. The column shows as many of these as fit its height.
max_messages=60

# Inner padding around the text block, in px
pad=8

# Text render supersampling for crisp outlines (2 = render at 2x, downscale).
# Set 1 to disable if you ever need to save CPU.
supersample=2

# Frame rate for animated emotes
anim_fps=12

# Background opacity behind the text: 0.0 = fully transparent (OLED-safe).
# Try 0.35-0.6 for a dim panel behind the chat.
bg_opacity=0.0

# Fonts (TTF/OTF paths). Defaults are Windows' Segoe UI. Point these at a
# Roobert .ttf for the exact anu look.
font_regular=C:/Windows/Fonts/segoeui.ttf
font_bold=C:/Windows/Fonts/seguisb.ttf

# Path to python.exe. Blank = auto-use the python bundled next to mpv.exe.
python=
