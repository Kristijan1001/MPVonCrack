# ── Which debrid service handles .torrent files and magnet links ──────────
#
#   realdebrid   Real-Debrid  (needs script-opts/realdebrid.conf)
#   torbox       TorBox       (needs script-opts/torbox.conf)
#
# Switch it at any time from the right-click menu:
#     Streaming > Switch Provider (Real-Debrid <-> TorBox)
# That rewrites the line below, so the choice survives a restart.
#
# Only the selected provider responds when you open a .torrent — this is
# what stops the two streamers fighting over the same file.
#
# Note: this switch only affects .torrent files. Magnet links always go
# through Real-Debrid (Ctrl+Shift+M / Ctrl+Shift+V), because that's the only
# magnet streamer here — switching to TorBox doesn't take magnets away.

provider=realdebrid
