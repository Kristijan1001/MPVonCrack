# Custom_Kick_Live_Timeline.lua options  (change values, then restart mpv)
#
# Opens Kick LIVE streams as raw HLS instead of letting ytdl_hook hand mpv a
# fake full-length timeline. Measured on one live channel:
#   via ytdl_hook : duration 16928s (4h42m), seekable=yes, ~6.5s really buffered
#   direct HLS    : duration 15.7s,          seekable=no
# Only live channel URLs are touched. kick.com/video/... VODs, clips, and browse
# pages are left to ytdl_hook, where a full seekable timeline is correct.
#
# This is NOT an ad blocker - Kick's live playlist carries no stitched ads that
# reach mpv (checked 2026-08-19: its only EXT-X-DATERANGE tags are plain
# timestamp / stream-source metadata, no SCTE-35).

# Path to yt-dlp. Blank = use the copy sitting next to mpv.exe, then fall back
# to "yt-dlp" on PATH. Set an absolute path here to override.
ytdl_path=

# Format passed to yt-dlp -f when resolving the stream URL.
format=best

# Seconds allowed for the yt-dlp resolve step.
timeout=20

# Show a short OSD line when a Kick stream is opened directly. Off by default -
# this is a fix, not a feature, so it shouldn't announce itself every time.
osd=no
