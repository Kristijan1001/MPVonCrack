# Custom_Twitch_AdBlock.lua options  (change values, then restart mpv)
#
# The ad blocker is always on - there is no enable/disable switch by design.
# Known cost: live rewind does NOT work on Twitch, because the proxy master
# playlist is not seekable. If every proxy below is unreachable the script
# falls back to normal yt-dlp resolution (with ads) on its own.

# Playlist proxies, tried in order - first one returning a real #EXTM3U wins.
# Only the master playlist goes through these; the variant playlists inside it
# point straight at Twitch's CDN, so all video comes direct from Twitch.
#
# These services do die off periodically. Verified working 2026-08-19:
#   https://eu.luminous.dev/live
#   https://lb-eu.cdn-perfprod.com/live
#   https://lb-as.cdn-perfprod.com/live
# Known dead as of the same date: lb-eu2 / lb-na .cdn-perfprod.com
#
# List BASE urls only. The script appends the channel plus
# "?allow_source=true&allow_audio_only=true" - without allow_source these
# proxies return transcodes ONLY and you get capped at 720p.
#
# To test one by hand (pick a channel that is actually live):
#   curl -s "https://eu.luminous.dev/live/CHANNEL?allow_source=true" | grep RESOLUTION
# -> want 1920x1080 in the list, not just 1280x720 and below.
proxies=https://eu.luminous.dev/live,https://lb-eu.cdn-perfprod.com/live,https://lb-as.cdn-perfprod.com/live

# Seconds to wait on each proxy before trying the next.
timeout=8

# Show a short OSD line when a stream is swapped to the ad-free playlist.
osd=yes
